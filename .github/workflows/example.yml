# Example: Add this to your repo's .github/workflows/security.yml
name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Sentinel Security Scan
        uses: hitcreate/sentinel@main
        with:
          url: 'https://your-app.vercel.app'
          min-grade: 'C'   # Fail the build if grade drops below C

